# Example configuration for Axis Q1806-LE cameras. Adjust hosts, credentials,
# profiles, and schedule times to match your deployment.
cameras:
  q1806_entry:
    host: 192.168.0.90
    protocol: http
    username_env: AXIS_Q1806_USER
    password_env: AXIS_Q1806_PASS

profiles:
  day:
    description: Daytime profile for traffic overview (shorter exposure, less gain).
    parameters:
      # Scene / global
      root.ImageSource.I0.SceneProfile: traffic_overview

      # Day/night behavior
      root.ImageSource.I0.DayNight.IrCutFilter: auto

      # Exposure / gain: favor less motion blur
      root.ImageSource.I0.Sensor.Exposure: auto
      root.ImageSource.I0.Sensor.MinExposureTime: "1"
      # Shorter max exposure to reduce motion blur in daylight
      root.ImageSource.I0.Sensor.MaxExposureTime: "2000"
      # Lower gain since there should be plenty of light
      root.ImageSource.I0.Sensor.MinGain: "0"
      root.ImageSource.I0.Sensor.MaxGain: "50"

      # Image “look”
      root.ImageSource.I0.Sensor.Brightness: "50"
      root.ImageSource.I0.Sensor.Contrast: "50"
      root.ImageSource.I0.Sensor.ColorLevel: "50"
      root.ImageSource.I0.Sensor.Sharpness: "50"
      root.ImageSource.I0.Sensor.SNF: "70"   # moderate spatial noise filter
      root.ImageSource.I0.Sensor.TNF: "70"   # moderate temporal noise filter
      root.ImageSource.I0.Sensor.Defog: "off"
      root.ImageSource.I0.Sensor.WhiteBalance: auto

  night:
    description: Night profile with more gain, longer exposure, stronger noise reduction.
    parameters:
      # Keep same scene profile
      root.ImageSource.I0.SceneProfile: traffic_overview

      # Let camera handle IR cut, keep auto
      root.ImageSource.I0.DayNight.IrCutFilter: auto

      # Exposure / gain: allow more light and noise reduction
      root.ImageSource.I0.Sensor.Exposure: auto
      root.ImageSource.I0.Sensor.MinExposureTime: "1"
      # Allow longer shutter for night
      root.ImageSource.I0.Sensor.MaxExposureTime: "8333"
      # Allow full gain range
      root.ImageSource.I0.Sensor.MinGain: "0"
      root.ImageSource.I0.Sensor.MaxGain: "100"

      # Image “look” – slightly reduced sharpness + stronger NR for night
      root.ImageSource.I0.Sensor.Brightness: "50"
      root.ImageSource.I0.Sensor.Contrast: "50"
      root.ImageSource.I0.Sensor.ColorLevel: "45"
      root.ImageSource.I0.Sensor.Sharpness: "40"
      root.ImageSource.I0.Sensor.SNF: "100"  # max spatial noise filter
      root.ImageSource.I0.Sensor.TNF: "100"  # max temporal noise filter
      root.ImageSource.I0.Sensor.Defog: "on"
      root.ImageSource.I0.Sensor.DefogEffect: "50"
      root.ImageSource.I0.Sensor.WhiteBalance: auto
